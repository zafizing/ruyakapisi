<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Queue — walk it yourself</title>
<meta name="description" content="You are at the back of a queue with nothing at the end. Scroll to walk toward the door. You will not reach it.">
<meta property="og:title" content="The Queue">
<meta property="og:description" content="You are at the back. 12,847 people are ahead of you. Scroll.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#131316; --night-2:#1B1B1F;
    --bone:#F2F0EA; --bone-dim:#8C8C95;
    --amber:#E39B2E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--night); color:var(--bone);
    font-family:Archivo,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; inset:0 0 auto 0; z-index:20;
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:14px; padding:18px 22px;
    font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--bone-dim);
    background:linear-gradient(to bottom, rgba(19,19,22,.94), rgba(19,19,22,0));
    pointer-events:none;
  }
  .hud b{display:block; margin-top:3px; font-size:15px; font-weight:500; color:var(--bone); letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  .hud__right{text-align:right;}
  .hud__right b{color:var(--amber);}

  /* ---------- DECK ---------- */
  .deck{
    height:100dvh; overflow-y:scroll;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .deck::-webkit-scrollbar{width:0;}

  .screen{
    height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column; justify-content:center;
    padding:96px 26px 110px; max-width:900px; margin:0 auto;
    position:relative;
  }

  /* person */
  .p__n{
    font-family:"DM Mono",monospace; font-size:12px; letter-spacing:.18em;
    color:var(--bone-dim); margin:0 0 20px;
  }
  .p__line{
    font-weight:600; font-size:clamp(31px,7.4vw,74px); line-height:1.1;
    letter-spacing:-.03em; margin:0;
  }
  .p__line.is-silent{color:var(--bone-dim); font-weight:400; font-style:italic; font-size:clamp(24px,5vw,48px);}
  .p__meta{
    margin:26px 0 0; font-family:"DM Mono",monospace;
    font-size:11.5px; letter-spacing:.06em; color:var(--bone-dim);
  }

  /* interrupt */
  .screen--stop{background:var(--night-2);}
  .stop__big{
    font-family:"DM Mono",monospace; font-weight:500;
    font-size:clamp(52px,14vw,132px); line-height:.94;
    letter-spacing:-.03em; color:var(--amber); margin:0;
    font-variant-numeric:tabular-nums;
  }
  .stop__txt{
    margin:22px 0 0; font-size:clamp(19px,3.2vw,29px); line-height:1.36;
    max-width:640px; font-weight:400;
  }
  .stop__sub{margin:18px 0 0; font-family:"DM Mono",monospace; font-size:12px; color:var(--bone-dim); letter-spacing:.06em;}

  /* intro */
  .intro__k{font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--amber); margin:0 0 22px;}
  .intro__h{font-weight:600; font-size:clamp(33px,7.2vw,70px); line-height:1.08; letter-spacing:-.03em; margin:0;}
  .intro__p{margin:26px 0 0; font-size:clamp(16px,2.4vw,20px); color:var(--bone-dim); max-width:520px; line-height:1.5;}
  .cue{
    position:absolute; left:26px; bottom:46px;
    font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--bone-dim);
    animation:drift 2.6s ease-in-out infinite;
  }
  @keyframes drift{0%,100%{transform:translateY(0); opacity:.55;} 50%{transform:translateY(7px); opacity:1;}}

  /* join */
  .screen--join{background:var(--night-2);}
  .join__h{font-weight:600; font-size:clamp(30px,6vw,54px); line-height:1.12; letter-spacing:-.028em; margin:0;}
  .field{display:flex; margin:32px 0 0; max-width:620px; border-bottom:2px solid var(--bone);}
  .field input{
    flex:1; min-width:0; font-family:Archivo,sans-serif; font-size:clamp(18px,2.8vw,24px);
    padding:13px 2px; background:transparent; color:var(--bone); border:none; outline:none;
  }
  .field input::placeholder{color:#55555E;}
  .field button{
    flex:0 0 auto; padding:0 20px; cursor:pointer; background:transparent; color:var(--amber);
    border:none; border-left:1px solid #3A3A42;
    font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  }
  .prices{display:flex; gap:10px; flex-wrap:wrap; margin:30px 0 0;}
  .price{
    padding:15px 20px; cursor:pointer; background:transparent; color:var(--bone);
    border:1px solid #3A3A42; text-align:left;
    font-family:"DM Mono",monospace; font-size:12px; letter-spacing:.06em;
    transition:border-color .15s ease, color .15s ease;
  }
  .price:hover,.price:focus-visible{border-color:var(--amber); color:var(--amber); outline:none;}
  .price s{display:block; font-size:10px; color:var(--bone-dim); text-decoration:none; letter-spacing:.14em; text-transform:uppercase; margin-bottom:5px;}
  .fine{margin:24px 0 0; font-family:"DM Mono",monospace; font-size:11px; color:var(--bone-dim); line-height:1.7; letter-spacing:.04em;}

  /* ticket */
  .screen--ticket{background:var(--night-2); display:none;}
  .screen--ticket.is-open{display:flex;}
  .tk{
    align-self:flex-start; width:min(340px,100%);
    background:var(--bone); color:var(--night);
    padding:26px 24px 0;
  }
  .tk__k,.tk__l{font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#57575F; text-align:center;}
  .tk__rule{border-top:1px dashed #B2AFA4; margin:15px 0;}
  .tk__n{font-family:"DM Mono",monospace; font-weight:500; font-size:54px; line-height:1.04; text-align:center; margin:5px 0 0;}
  .tk__said{text-align:center; font-size:15px; margin:11px 0 0; color:#57575F;}
  .tk__rows{margin:17px 0 0; font-family:"DM Mono",monospace; font-size:11.5px;}
  .tk__r{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dotted #B2AFA4; color:#57575F;}
  .tk__r b{color:var(--night); font-weight:500;}
  .tk__f{margin:15px 0 0; padding-top:11px; font-family:"DM Mono",monospace; font-size:10px; color:#57575F; text-align:center;}
  .tk__tear{height:14px; margin:8px -24px 0; background:radial-gradient(circle at 7px 14px, transparent 6px, var(--night-2) 6px 6.9px, transparent 7px) repeat-x; background-size:14px 14px;}
  .share{display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 0;}
  .share button{
    padding:13px 20px; cursor:pointer; background:var(--amber); color:var(--night); border:1px solid var(--amber);
    font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  }
  .share button.alt{background:transparent; color:var(--bone); border-color:#3A3A42;}

  /* persistent CTA */
  .cta{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; justify-content:center; padding:0 0 22px;
    background:linear-gradient(to top, rgba(19,19,22,.96), rgba(19,19,22,0));
  }
  .cta button{
    pointer-events:auto; padding:14px 30px; cursor:pointer;
    background:var(--bone); color:var(--night); border:1px solid var(--bone);
    font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  }
  .cta button:hover{background:var(--amber); border-color:var(--amber);}

  @media (max-width:640px){
    .screen{padding:88px 20px 104px;}
    .cue{left:20px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; scroll-behavior:auto !important;}
    .deck{scroll-snap-type:none;}
  }
</style>
</head>
<body>

<div class="hud">
  <div>Walked<b id="hud-walked">0 m</b></div>
  <div class="hud__right">People still ahead<b id="hud-left">12,847</b></div>
</div>

<div class="deck" id="deck"></div>

<div class="cta"><button id="cta">Take your place</button></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
     DEMO DATA. Replace with a real feed. The lines ARE the product —
     inventing them is the one lie this page cannot survive.
  ----------------------------------------------------------------*/
  var COUNT = 12847, PRICE = 5;
  var DOOR  = { lat:39.7554, lng:32.8043 };
  var SITE  = "thequeue.example";

  var lines = [
    "a phone call","my visa","nothing, I was curious","the results","him to notice",
    "my mother to call first","spring","the last exam","a reply to one email",
    "my sister to forgive me","the rent to be possible","someone to sit next to me",
    "nothing in particular","the swelling to go down","my name called somewhere else",
    "a job, any job","my flight","the dog to come back","to stop checking my phone",
    "an apology I will not get","the kettle","my turn, generally","a sign",
    "the divorce to finish","to feel like myself again","payday","the ceasefire",
    "my hands to stop shaking","the bus","to be picked","him to text back",
    "a house I can afford","the season to change","my father to wake up",
    "nothing. I just liked the queue","the delivery","to be old enough","forgiveness",
    "my citizenship","the second interview","a friend to move back","the noise to stop",
    "someone to notice I left","the ferry","my brother's release","to find out",
    "a normal week","the scan","to stop waiting","",""
  ];

  var deck = document.getElementById("deck");
  var state = { cursor:COUNT, walked:0, joined:false, myNumber:null, said:"" };

  function fmt(n){ return n.toLocaleString("en-US"); }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c];
    });
  }
  function seeded(seed){
    var s = seed * 2654435761 % 2147483647;
    return function(){ s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
  }
  function lineFor(n){ return lines[Math.floor(seeded(n)() * lines.length)]; }
  function coordFor(p){
    return (DOOR.lat + p * 0.0000075).toFixed(5) + "\u00B0, " +
           (DOOR.lng + p * 0.0000061).toFixed(5) + "\u00B0";
  }

  /* Walking pace: a real queue shuffles about 20 metres an hour. */
  function hoursToDoor(left){ return left / 20; }
  function paceText(left){
    var h = hoursToDoor(left);
    if(h < 48) return Math.round(h) + " hours";
    var d = h / 24;
    if(d < 60) return Math.round(d) + " days";
    return Math.round(d / 30) + " months";
  }

  /* ---------- screen builders ---------- */
  function intro(){
    return '<section class="screen">' +
      '<p class="intro__k">You have joined nothing yet</p>' +
      '<h1 class="intro__h">You are standing at the back of a queue.</h1>' +
      '<p class="intro__p">There are ' + fmt(COUNT) + ' people ahead of you, one metre apart, ' +
      'and there is nothing at the end of it. Everyone here paid to stand in it, ' +
      'and everyone was asked one question first.</p>' +
      '<p class="intro__p">Scroll to walk forward. You will not reach the door.</p>' +
      '<div class="cue">Scroll &darr;</div>' +
    '</section>';
  }

  function person(n){
    var w = lineFor(n), silent = !w;
    return '<section class="screen" data-n="' + n + '">' +
      '<p class="p__n">\u2116 ' + fmt(n) + ' \u00B7 ' + (n / 1000).toFixed(2) + ' km from the door</p>' +
      '<p class="p__line' + (silent ? " is-silent" : "") + '">' +
        (silent ? "said nothing" : esc(w)) + '</p>' +
      '<p class="p__meta">standing at ' + coordFor(n) + '</p>' +
    '</section>';
  }

  function stop(walked, left){
    return '<section class="screen screen--stop">' +
      '<p class="stop__big">' + fmt(walked) + ' m</p>' +
      '<p class="stop__txt">That is how far you have walked. ' +
        '<b>' + fmt(left) + '</b> people are still ahead of you.</p>' +
      '<p class="stop__sub">At the pace a real queue moves, you would reach the door in ' +
        paceText(left) + '. The door does not open.</p>' +
    '</section>';
  }

  function join(){
    return '<section class="screen screen--join" id="join">' +
      '<h2 class="join__h">What are you waiting for?</h2>' +
      '<div class="field">' +
        '<input id="said" type="text" maxlength="70" placeholder="a phone call \u00B7 nothing \u00B7 my results" aria-label="What are you waiting for?">' +
      '</div>' +
      '<div class="prices">' +
        '<button class="price" data-places="1"><s>One place</s>$5</button>' +
        '<button class="price" data-places="5"><s>Five in a row</s>$20</button>' +
        '<button class="price" data-places="10"><s>Ten in a row</s>$35</button>' +
      '</div>' +
      '<p class="fine">Your number is permanent and can only go up.<br>' +
      'Nothing is posted to you. No refunds, no transfers, no leaving.<br>' +
      'The door never opens. This is stated plainly so nobody is surprised.</p>' +
    '</section>';
  }

  function ticket(){
    return '<section class="screen screen--ticket" id="tkscreen">' +
      '<div class="tk">' +
        '<div class="tk__k">The Queue \u00B7 Issued once</div>' +
        '<div class="tk__rule"></div>' +
        '<div class="tk__l">Your number</div>' +
        '<div class="tk__n" id="tk-n">\u2014</div>' +
        '<div class="tk__said" id="tk-s"></div>' +
        '<div class="tk__rows">' +
          '<div class="tk__r"><span>Distance from door</span><b id="tk-d">\u2014</b></div>' +
          '<div class="tk__r"><span>People behind you</span><b id="tk-b">0</b></div>' +
          '<div class="tk__r"><span>Estimated wait</span><b>Never</b></div>' +
        '</div>' +
        '<div class="tk__f">Keep this. It will not be reissued.</div>' +
        '<div class="tk__tear"></div>' +
      '</div>' +
      '<div class="share">' +
        '<button id="dl">Download for stories</button>' +
        '<button id="dl2" class="alt">Square</button>' +
      '</div>' +
    '</section>';
  }

  /* ---------- build & extend ---------- */
  var BATCH = 14, sinceStop = 0;

  function extend(){
    var html = "", i;
    for(i = 0; i < BATCH && state.cursor > 1; i++){
      state.cursor -= 1; sinceStop += 1;
      html += person(state.cursor);
      if(sinceStop >= 11){
        html += stop(COUNT - state.cursor, state.cursor);
        sinceStop = 0;
      }
    }
    var j = document.getElementById("join");
    if(j){ j.insertAdjacentHTML("beforebegin", html); }
    else  { deck.insertAdjacentHTML("beforeend", html); }
  }

  deck.innerHTML = intro();
  extend();
  deck.insertAdjacentHTML("beforeend", join() + ticket());

  /* ---------- HUD ---------- */
  var screens;
  function refresh(){ screens = deck.querySelectorAll(".screen[data-n]"); }
  refresh();

  var ticking = false;
  deck.addEventListener("scroll", function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var mid = deck.scrollTop + deck.clientHeight / 2, seen = null, i, el;
      for(i = 0; i < screens.length; i++){
        el = screens[i];
        if(el.offsetTop <= mid) seen = el; else break;
      }
      if(seen){
        var n = Number(seen.dataset.n);
        state.walked = COUNT - n;
        document.getElementById("hud-walked").textContent = fmt(state.walked) + " m";
        document.getElementById("hud-left").textContent   = fmt(n);
      }
      /* keep the line going as they walk */
      if(deck.scrollHeight - deck.scrollTop - deck.clientHeight < deck.clientHeight * 3){
        extend(); refresh();
      }
      ticking = false;
    });
  }, { passive:true });

  /* ---------- join ---------- */
  document.getElementById("cta").addEventListener("click", function(){
    document.getElementById("join").scrollIntoView({ behavior:"smooth" });
  });

  deck.addEventListener("click", function(e){
    var b = e.target.closest(".price");
    if(!b) return;
    /* → real flow: open Paddle checkout, write the position server-side
       in the transaction.completed webhook, then reload from server. */
    var places = Number(b.dataset.places);
    state.said     = (document.getElementById("said").value || "").trim();
    state.myNumber = COUNT + 1;
    state.joined   = true;

    document.getElementById("tk-n").textContent = fmt(state.myNumber);
    document.getElementById("tk-s").textContent = state.said ? "\u201C" + state.said + "\u201D" : "You said nothing.";
    document.getElementById("tk-d").textContent = (state.myNumber / 1000).toFixed(2) + " km";
    document.getElementById("tk-b").textContent = fmt(places - 1);
    var ts = document.getElementById("tkscreen");
    ts.classList.add("is-open");
    ts.scrollIntoView({ behavior:"smooth" });
  });

  /* ---------- share card ---------- */
  function wrap(ctx, t, maxW){
    var out = [], line = "";
    String(t).split(" ").forEach(function(w){
      var test = line ? line + " " + w : w;
      if(ctx.measureText(test).width > maxW && line){ out.push(line); line = w; }
      else line = test;
    });
    if(line) out.push(line);
    return out;
  }

  function card(W, H){
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.fillStyle = "#131316"; x.fillRect(0, 0, W, H);

    var pad = W * 0.11;
    x.textAlign = "left";

    x.fillStyle = "#E39B2E";
    x.font = "500 " + (W * 0.026) + "px 'DM Mono', monospace";
    x.fillText("THE QUEUE \u00B7 \u2116 " + fmt(state.myNumber), pad, H * 0.30);

    x.fillStyle = "#F2F0EA";
    x.font = "600 " + (W * 0.088) + "px Archivo, sans-serif";
    var ty = H * 0.40;
    var quote = state.said ? "\u201C" + state.said + "\u201D" : "Said nothing.";
    wrap(x, quote, W - pad * 2).slice(0, 4).forEach(function(l){
      x.fillText(l, pad, ty); ty += W * 0.105;
    });

    x.strokeStyle = "#3A3A42"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(pad, ty + H * 0.02); x.lineTo(W - pad, ty + H * 0.02); x.stroke();

    x.fillStyle = "#8C8C95";
    x.font = "400 " + (W * 0.031) + "px 'DM Mono', monospace";
    x.fillText((state.myNumber / 1000).toFixed(2) + " km from a door that never opens",
               pad, ty + H * 0.065);
    x.fillText("Estimated wait: never", pad, ty + H * 0.105);
    x.fillStyle = "#E39B2E";
    x.fillText(SITE, pad, ty + H * 0.155);
    return c;
  }

  function save(W, H){
    if(!state.joined) return;
    var go = function(){
      card(W, H).toBlob(function(b){
        var u = URL.createObjectURL(b), a = document.createElement("a");
        a.href = u; a.download = "the-queue.png"; a.click();
        setTimeout(function(){ URL.revokeObjectURL(u); }, 1500);
      });
    };
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  }

  deck.addEventListener("click", function(e){
    if(e.target.id === "dl")  save(1080, 1920);
    if(e.target.id === "dl2") save(1080, 1080);
  });
})();
</script>
</body>
</html>
